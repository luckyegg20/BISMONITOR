name: DOB watch

on:
  schedule:
    - cron: "7 12,16,20 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dob-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Check BIS
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
          ALERT_FROM: ${{ secrets.ALERT_FROM }}
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          SOCRATA_TOKEN: ${{ secrets.SOCRATA_TOKEN }}
          TZ: America/New_York
        run: python monitor.py

      - name: Save state and dashboard
        run: |
          git config user.name "dob-watch"
          git config user.email "dob-watch@users.noreply.github.com"
          git add -A
          git diff --staged --quiet || git commit -m "check $(date -u +%Y-%m-%dT%H:%MZ)"
          git push

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DOB watch</title>
<style>
:root{
  --ink:#0E1216; --panel:#161B21; --line:#232B33; --line2:#2E3841;
  --text:#E9E7E2; --dim:#8B939B; --faint:#666E76;
  --hot:#E2564D; --cool:#5E9E7B; --warn:#D9A441;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--ink);color:var(--text);
  font:16px/1.5 "Helvetica Neue",Helvetica,Arial,sans-serif;
  font-variant-numeric:tabular-nums}
.wrap{max-width:960px;margin:0 auto;padding:28px 20px 80px}

header{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:baseline;
  justify-content:space-between;border-bottom:2px solid var(--text);
  padding-bottom:12px;margin-bottom:24px}
h1{margin:0;font-size:21px;font-weight:600;letter-spacing:-.01em}
.stamp{font-size:13px;color:var(--dim)}
.stamp b{color:var(--text);font-weight:600}

.headline{font-size:clamp(19px,3.1vw,29px);line-height:1.25;font-weight:600;
  letter-spacing:-.02em;margin:0 0 8px;max-width:none;text-wrap:balance}
.headline.quiet{color:var(--dim);font-weight:400}
.sum{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 22px}
.sum .stat{flex:1 1 150px;background:var(--panel);border-left:3px solid var(--line2);
  padding:10px 14px}
.sum .stat.hit{border-left-color:var(--hot)}
.sum .stat.many{border-left-color:var(--warn)}
.sum .stat b{display:block;font-size:26px;font-weight:600;line-height:1.1}
.sum .stat.hit b{color:var(--hot)}
.sum .stat.many b{color:var(--warn)}
.sum .stat span{font-size:12px;color:var(--dim)}
.sum .stat em{font-style:normal;color:var(--hot);font-weight:600}
.since{font-size:14px;color:var(--dim);margin:0 0 24px}

.controls{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px}
input[type=search],select{background:var(--panel);color:var(--text);
  border:1px solid var(--line2);border-radius:2px;padding:8px 10px;
  font:inherit;font-size:14px}
input[type=search]{flex:1 1 200px;min-width:0}
select{flex:0 0 auto}
button{background:var(--panel);color:var(--text);border:1px solid var(--line2);
  border-radius:2px;padding:8px 12px;font:inherit;font-size:14px;cursor:pointer}
button:hover{border-color:var(--text)}
:focus-visible{outline:2px solid var(--warn);outline-offset:2px}

table{width:100%;border-collapse:collapse;margin-top:14px}
th{text-align:left;font-size:12px;font-weight:600;color:var(--dim);
  padding:0 8px 8px 0;border-bottom:1px solid var(--line2);white-space:nowrap;
  vertical-align:bottom}
th.n{text-align:right;padding-right:12px;white-space:normal;max-width:96px}
tbody tr.b{border-bottom:1px solid var(--line);cursor:pointer}
tbody tr.b:hover td,tbody tr.b.open td{background:#131920}
td{padding:12px 8px 12px 0;font-size:15px;vertical-align:top}
td.n{text-align:right;padding-right:12px;font-weight:600;font-size:20px}
/* inherit, so a cell's tier colour carries through to the link inside it */
td a{color:inherit;text-decoration:none;border-bottom:1px solid var(--line2)}
td a:hover,td a:focus{border-bottom-color:currentColor}
td a:visited{color:inherit}
td.n.hot{color:var(--hot)}
td.n.many{color:var(--warn)}
td.n.zero{color:var(--faint)}
td.n.na{color:var(--warn)}
.of{display:block;font-size:11px;color:var(--faint);font-weight:400;margin-top:1px}
.delta{display:block;font-size:11px;font-weight:600;margin-top:1px;color:var(--hot)}
.delta.down{color:var(--cool)}
.name{font-weight:500}
.sub{display:block;font-size:12px;color:var(--faint);margin-top:3px}
.sub.err{color:var(--warn)}
.chev{display:inline-block;width:14px;color:var(--faint);font-size:12px}

tr.detail td{padding:0 0 18px;border-bottom:1px solid var(--line)}
.panel{background:var(--panel);padding:16px}
.panel h3{margin:0 0 2px;font-size:13px;font-weight:600;color:var(--dim)}
.charts{display:flex;flex-wrap:wrap;gap:18px;margin-top:10px}
.chart{flex:1 1 210px;min-width:180px}
.chart .cap{font-size:12px;color:var(--dim);margin-bottom:4px}
.chart .cap b{color:var(--text);font-size:15px;font-weight:600}
svg{display:block;width:100%;height:56px;overflow:visible}
.links{margin-top:14px;font-size:13px;display:flex;flex-wrap:wrap;gap:14px}
.links a{color:var(--text);text-decoration:none;border-bottom:1px solid var(--line2)}
.links a:hover{border-bottom-color:var(--text)}
.flat{font-size:13px;color:var(--faint);margin-top:10px}

.cx{margin-top:16px;border-top:1px solid var(--line2);padding-top:12px}
.cx h4{margin:0 0 8px;font-size:12px;font-weight:600;color:var(--dim)}
.cx label{display:flex;gap:10px;align-items:flex-start;padding:7px 0;
  border-bottom:1px solid var(--line);cursor:pointer;font-size:14px}
.cx label:last-of-type{border-bottom:0}
.cx input{margin:3px 0 0;flex:0 0 auto;width:15px;height:15px;accent-color:var(--cool)}
.cx .num{font-weight:600;min-width:74px}
.cx .meta{color:var(--faint);font-size:12px}
.cx a{color:var(--dim);text-decoration:none;border-bottom:1px solid var(--line2)}
.cx a:hover{color:var(--text)}
.cx .done{color:var(--cool);font-weight:600;font-size:12px}
.cx .todo{color:var(--warn);font-weight:600;font-size:12px}
.save{position:sticky;bottom:0;margin-top:20px;background:var(--panel);
  border-top:2px solid var(--warn);padding:12px 16px;display:flex;flex-wrap:wrap;
  gap:10px;align-items:center;font-size:14px}
.save b{color:var(--warn)}
.save input[type=text]{width:70px}

.msg{background:var(--panel);border-left:3px solid var(--warn);padding:14px 16px;
  font-size:14px;line-height:1.6}
.msg code{background:#0B0F13;padding:1px 5px;font-size:13px}
footer{margin-top:36px;font-size:13px;color:var(--faint);line-height:1.7}
@media(max-width:640px){
  td.n{font-size:17px;padding-right:6px}
  th.n{padding-right:6px}
  td{font-size:14px}
}
</style>
</head>
<body>
<div class="wrap">

<header>
  <h1>DOB watch</h1>
  <div class="stamp" id="stamp">Loading</div>
</header>

<div id="app">
  <p class="headline quiet">Loading</p>
</div>

<footer>
  Complaints column counts filings in the last 30 days; the other two count open records.
  Small number is everything on file.
  Click a building for its trend and links into BIS.
</footer>
</div>

<script>
const SEC = ["complaints","dob_violations","ecb_violations"];
const NAME = {complaints:"Complaints (30d)", dob_violations:"Violations-DOB", ecb_violations:"Violations-OATH/ECB"};
const VERB = {complaints:"filed in last 30 days", dob_violations:"open", ecb_violations:"open"};
const app = document.getElementById("app");
const stamp = document.getElementById("stamp");

let EMBEDDED = null;
let DATA = null, expanded = null;

// Who verified what. Stored in a Google Sheet behind an Apps Script web app,
// so a tick saves instantly and everyone sees it. Paste your /exec URL here.
const SHEET_URL = "PASTE_YOUR_EXEC_URL_HERE";
let STATUS = {}, WHO = "", SAVING = 0, SAVE_ERR = "";
try { WHO = localStorage.getItem("dobwatch_who") || ""; } catch (e) {}
const ui = {q:"", sort:"moved"};

// data.json sits next to this page. ?src=<url> points somewhere else,
// e.g. a raw.githubusercontent.com URL when you open this file locally.
const src = new URLSearchParams(location.search).get("src") || "data.json";

function esc(s){return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

/**
 * Complaints still needing attention: filed in the window and not yet ticked
 * as verified. The other two sections use the count as published.
 */
function openCount(b, sec){
  const s = b.sections[sec];
  if (typeof s?.open !== "number") return null;
  if (sec !== "complaints") return s.open;
  const recs = s.records;
  if (!Array.isArray(recs)) return s.open;
  return recs.filter(r => !STATUS[r.num]?.resolved).length;
}

function prevCounts(){
  const h = DATA.history || [];
  return h.length > 1 ? h[h.length-2].counts || {} : {};
}
function seriesFor(id, sec){
  return (DATA.history||[]).map(h => (h.counts?.[id]?.[sec] ?? null));
}

function openTotal(){
  let n = 0;
  for (const b of DATA.buildings)
    for (const s of SEC) { const v = openCount(b, s); if (v !== null) n += v; }
  return n;
}

function deltas(b){
  const p = prevCounts()[b.id] || {};
  const out = {};
  for (const s of SEC){
    const now = b.sections[s]?.open, was = p[s];
    out[s] = (typeof now === "number" && typeof was === "number" && now !== was) ? now - was : 0;
  }
  return out;
}

function sparkline(vals){
  const v = vals.filter(x => typeof x === "number");
  if (v.length < 2) return '<p class="flat">Not enough history yet.</p>';
  const w = 200, h = 46, lo = Math.min(...v), hi = Math.max(...v), span = hi - lo || 1;
  const pts = v.map((y,i) => [i*(w/(v.length-1)), h - ((y-lo)/span)*(h-6) - 3]);
  const d = pts.map((p,i) => (i?"L":"M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ");
  const last = pts[pts.length-1];
  const rising = v[v.length-1] > v[0];
  const col = rising ? "var(--hot)" : "var(--cool)";
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" role="img"
    aria-label="${v.length} readings, ${v[0]} to ${v[v.length-1]}">
    <path d="${d}" fill="none" stroke="${col}" stroke-width="1.5"
      vector-effect="non-scaling-stroke"/>
    <circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="2.5" fill="${col}"/>
  </svg>`;
}

function detailRow(b){
  const charts = SEC.map(s => {
    const n = openCount(b, s);
    const cap = (s === "complaints" && Array.isArray(b.sections[s]?.records))
      ? `<b>${n}</b> of ${b.sections[s].records.length} filed in last 30 days still to verify`
      : `<b>${n === null ? "n/a" : n}</b> ${esc(NAME[s])} ${esc(VERB[s])}`;
    return `<div class="chart"><div class="cap">${cap}</div>
      ${sparkline(seriesFor(b.id, s))}</div>`;
  }).join("");
  const recs = b.sections.complaints?.records || [];
  const cx = recs.length ? `<div class="cx">
    <h4>Complaints filed in the last 30 days &mdash; tick once you have checked BIS</h4>
    ${recs.map(r => {
      const st = STATUS[r.num];
      const done = st && st.resolved;
      return `<label>
        <input type="checkbox" data-num="${esc(r.num)}"${done ? " checked" : ""}>
        <span>
          <span class="num">${esc(r.num)}</span>
          <span class="${done ? "done" : "todo"}">${done ? "RESOLVED" : "PENDING"}</span>
          <span class="meta"> &middot; filed ${esc(r.date)}${r.category ? " &middot; cat " + esc(r.category) : ""}
            &middot; <a href="${esc(r.url)}" target="_blank" rel="noopener">open on BIS</a>
            ${done && st.by ? " &middot; by " + esc(st.by) : ""}${done && st.at ? " on " + esc(st.at) : ""}</span>
        </span></label>`;
    }).join("")}
  </div>` : "";

  const links = SEC.filter(s => b.sections[s]?.url)
    .map(s => `<a href="${esc(b.sections[s].url)}" target="_blank" rel="noopener">${esc(NAME[s])} on BIS</a>`)
    .join("");
  const prof = b.profile_url
    ? `<a href="${esc(b.profile_url)}" target="_blank" rel="noopener">Property profile</a>` : "";
  const errs = SEC.filter(s => b.sections[s]?.error)
    .map(s => `${NAME[s]}: ${b.sections[s].error}`).join(" / ");
  return `<tr class="detail"><td colspan="4"><div class="panel">
    <h3>${esc(b.label)}${b.bin ? " &middot; BIN " + esc(b.bin) : ""}</h3>
    <div class="charts">${charts}</div>
    ${errs ? `<p class="flat" style="color:var(--warn)">${esc(errs)}</p>` : ""}
    <div class="links">${prof}${links}</div>
    ${cx}
  </div></td></tr>`;
}

function render(){
  if (!DATA) return;
  stamp.innerHTML = `Checked <b>${esc(DATA.checked_at)}</b> via ${DATA.source === "bis" ? "BIS" : "NYC Open Data"}`;

  const movedList = DATA.buildings.filter(b => Object.values(deltas(b)).some(d => d !== 0));

  // portfolio totals, and how many of each arrived since the last check
  const tot = {}, fresh = {};
  for (const s of SEC) { tot[s] = 0; fresh[s] = 0; }
  for (const b of DATA.buildings) {
    const d = deltas(b);
    for (const s of SEC) {
      const v = openCount(b, s);
      if (v !== null) tot[s] += v;
      if (d[s] > 0) fresh[s] += d[s];
    }
  }
  const CAPTION = {complaints:"complaints to verify", dob_violations:"open Violations-DOB",
                   ecb_violations:"open Violations-OATH/ECB"};
  const stats = SEC.map(s => {
    const n = tot[s];
    const cls = n === 0 ? "" : " many";
    const add = fresh[s] ? `<em>+${fresh[s]} new</em> &middot; ` : "";
    return `<div class="stat${cls}"><b>${n}</b><span>${add}${CAPTION[s]}</span></div>`;
  }).join("");

  const newBits = SEC.filter(s => fresh[s] > 0)
    .map(s => `${fresh[s]} new ${s === "complaints"
        ? (fresh[s] === 1 ? "complaint" : "complaints") : NAME[s]}`);
  const head = (newBits.length
    ? `<p class="headline">${newBits.join(", ")} since the last check.</p>`
    : `<p class="headline quiet">Nothing new since the last check.</p>`)
    + `<div class="sum">${stats}</div>`;
  const since = (DATA.history||[]).length > 1
    ? `<p class="since">Compared against the previous check. ${DATA.history.length} readings on file.</p>`
    : `<p class="since">First reading. New items show from the next check.</p>`;

  const q = ui.q.trim().toLowerCase();
  let rows = DATA.buildings.filter(b =>
    !q || b.label.toLowerCase().includes(q) || String(b.bin||"").includes(q));

  const openOf = (b,s) => { const v = openCount(b, s); return v === null ? -1 : v; };
  const biggest = b => Math.max(...Object.values(deltas(b)).map(Math.abs));
  const sorters = {
    moved: (a,b) => biggest(b) - biggest(a) || a.label.localeCompare(b.label),
    name:  (a,b) => a.label.localeCompare(b.label),
    complaints: (a,b) => openOf(b,"complaints") - openOf(a,"complaints"),
    dob_violations: (a,b) => openOf(b,"dob_violations") - openOf(a,"dob_violations"),
    ecb_violations: (a,b) => openOf(b,"ecb_violations") - openOf(a,"ecb_violations"),
  };
  rows = rows.slice().sort(sorters[ui.sort] || sorters.name);

  const body = rows.map(b => {
    const d = deltas(b);
    const cells = SEC.map(s => {
      const v = b.sections[s];
      const n = openCount(b, s);
      if (n === null) return `<td class="n na">n/a</td>`;
      // hide the delta on complaints once ticks have adjusted the number,
      // otherwise you get a confusing "0 (+1)"
      const adjusted = s === "complaints" && n !== v.open;
      const dd = (d[s] && !adjusted)
        ? `<span class="delta${d[s]<0?" down":""}">${d[s]>0?"+":""}${d[s]}</span>` : "";
      const inner = v.url ? `<a href="${esc(v.url)}">${n}</a>` : n;
      const tone = n === 0 ? "zero" : (n > 1 ? "many" : "hot");
      return `<td class="n ${tone}">${inner}
        <span class="of">of ${v.total ?? "?"}</span>${dd}</td>`;
    }).join("");
    const sub = b.error
      ? `<span class="sub err">${esc(b.error)}</span>`
      : `<span class="sub">${b.bin ? "BIN "+esc(b.bin) : "no BIN"}</span>`;
    const isOpen = expanded === b.id;
    return `<tr class="b${isOpen?" open":""}" data-id="${esc(b.id)}" tabindex="0"
        aria-expanded="${isOpen}">
      <td><span class="chev">${isOpen?"&#9662;":"&#9656;"}</span><span class="name">${esc(b.label)}</span>${sub}</td>
      ${cells}</tr>` + (isOpen ? detailRow(b) : "");
  }).join("");

  app.innerHTML = head + since + `
  <div class="controls">
    <input type="search" id="q" placeholder="Filter by address or BIN" value="${esc(ui.q)}">
    <select id="sort">
      <option value="moved">Sort: recent movement</option>
      <option value="name">Sort: address</option>
      <option value="complaints">Sort: recent complaints</option>
      <option value="dob_violations">Sort: open Violations-DOB</option>
      <option value="ecb_violations">Sort: open Violations-OATH/ECB</option>
    </select>
    <input type="text" id="who" placeholder="Your initials" value="${esc(WHO)}"
           style="flex:0 0 110px">
    <button id="reload">Reload</button>
  </div>
  <table><thead><tr>
    <th>Building</th><th class="n">Complaints (30d)</th><th class="n">Violations-DOB</th><th class="n">Violations-OATH/ECB</th>
  </tr></thead><tbody>${body || `<tr><td colspan="4" class="flat">No building matches that filter.</td></tr>`}</tbody></table>`;

  if (SAVING || SAVE_ERR) {
    const bar = document.createElement("div");
    bar.className = "save";
    bar.innerHTML = SAVE_ERR
      ? `<b>Not saved</b> <span>${esc(SAVE_ERR)}</span>`
      : `<b>Saving</b> <span>writing to the shared sheet</span>`;
    app.appendChild(bar);
  }

  const qs = document.getElementById("q");
  qs.addEventListener("input", e => { ui.q = e.target.value; render();
    const n = document.getElementById("q"); n.focus(); n.setSelectionRange(n.value.length, n.value.length); });
  const sel = document.getElementById("sort");
  sel.value = ui.sort;
  sel.addEventListener("change", e => { ui.sort = e.target.value; render(); });
  document.getElementById("who").addEventListener("input", e => {
    WHO = e.target.value.slice(0, 12);
    try { localStorage.setItem("dobwatch_who", WHO); } catch (err) {}
  });
  document.getElementById("reload").addEventListener("click", load);

  app.querySelectorAll(".cx input[type=checkbox]").forEach(cb => {
    cb.addEventListener("click", e => e.stopPropagation());
    cb.addEventListener("change", e => {
      e.stopPropagation();
      const num = cb.dataset.num;
      if (cb.checked) STATUS[num] = {resolved:true, by:WHO||"", at:new Date().toISOString().slice(0,10)};
      else delete STATUS[num];
      render();
      saveTick(num, cb.checked);
    });
  });

  app.querySelectorAll("tr.b").forEach(tr => {
    const toggle = () => { expanded = expanded === tr.dataset.id ? null : tr.dataset.id; render(); };
    tr.addEventListener("click", toggle);
    tr.addEventListener("keydown", e => {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggle(); }
    });
  });
}

/**
 * Apps Script sends no CORS header, so fetch() to it always fails. JSONP loads
 * the reply as a script tag, which browsers allow across origins. Reads and
 * writes both go through here.
 */
let jsonpSeq = 0;
function callSheet(params){
  return new Promise((resolve, reject) => {
    const cb = "dobwatch_cb_" + (++jsonpSeq);
    const q = new URLSearchParams({...params, callback: cb, t: Date.now()});
    const s = document.createElement("script");
    const timer = setTimeout(() => { cleanup(); reject(new Error("timed out")); }, 20000);
    function cleanup(){
      clearTimeout(timer);
      delete window[cb];
      if (s.parentNode) s.parentNode.removeChild(s);
    }
    window[cb] = data => { cleanup(); resolve(data); };
    s.onerror = () => { cleanup(); reject(new Error("could not reach the sheet")); };
    s.src = SHEET_URL + "?" + q.toString();
    document.head.appendChild(s);
  });
}

const NOT_WIRED = () => !SHEET_URL || SHEET_URL.startsWith("PASTE_");

async function loadStatus(){
  if (NOT_WIRED()) return;
  try {
    const j = await callSheet({});
    if (j.ok) { STATUS = j.status || {}; SAVE_ERR = ""; }
    else SAVE_ERR = j.error || "the sheet returned an error";
  } catch (err) { SAVE_ERR = "cannot reach the sheet: " + err.message; }
}

async function saveTick(num, resolved){
  if (NOT_WIRED()) {
    SAVE_ERR = "SHEET_URL is not set in index.html, so nothing was saved";
    render(); return;
  }
  SAVING++; SAVE_ERR = ""; render();
  try {
    const j = await callSheet({num, resolved: String(resolved), by: WHO});
    if (j.ok) STATUS = j.status || {};
    else SAVE_ERR = j.error || "the sheet refused the write";
  } catch (err) {
    SAVE_ERR = "save failed: " + err.message;
  } finally { SAVING--; render(); }
}

async function load(){
  if (EMBEDDED) { DATA = EMBEDDED; render(); return; }
  try {
    const r = await fetch(src + (src.includes("?") ? "&" : "?") + "t=" + Date.now(),
                          {cache:"no-store"});
    if (!r.ok) throw new Error("HTTP " + r.status);
    DATA = await r.json();
    await loadStatus();
    render();
  } catch (err) {
    stamp.textContent = "No data";
    app.innerHTML = `<p class="headline quiet">No results yet.</p>
      <div class="msg">Could not read <code>${esc(src)}</code>: ${esc(err.message)}.<br><br>
      This page reads <code>data.json</code> from the same folder. Run the checker once
      so it publishes that file, then reload.<br><br>
      Opening this file straight off your desktop? Browsers block local file reads.
      Either use the GitHub Pages URL, or append
      <code>?src=</code> and a raw.githubusercontent.com link to data.json.</div>`;
  }
}
load();
</script>
<!-- Visitor counting. Replace YOURCODE with the code from your GoatCounter
     account, then this line starts recording pageviews and unique visitors.
     No cookies, no personal data, nothing to consent to. Delete the line to
     turn counting off. -->
<script data-goatcounter="https://YOURCODE.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
</body>
</html>

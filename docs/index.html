<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DOB Watch by JL</title>
<style>
:root{
  --ink:#0E1216; --panel:#161B21; --line:#232B33; --line2:#2E3841;
  --text:#E9E7E2; --dim:#8B939B; --faint:#666E76;
  --hot:#E2564D; --cool:#5E9E7B; --warn:#D9A441;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--ink);color:var(--text);
  font:16px/1.5 "Helvetica Neue",Helvetica,Arial,sans-serif;
  font-variant-numeric:tabular-nums}
.wrap{max-width:960px;margin:0 auto;padding:28px 20px 80px}

header{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:baseline;
  justify-content:space-between;border-bottom:2px solid var(--text);
  padding-bottom:12px;margin-bottom:24px}
h1{margin:0;font-size:21px;font-weight:600;letter-spacing:-.01em}
.stamp{font-size:13px;color:var(--dim)}
.stamp b{color:var(--text);font-weight:600}

.headline{font-size:clamp(19px,3.1vw,29px);line-height:1.25;font-weight:600;
  letter-spacing:-.02em;margin:0 0 8px;max-width:none;text-wrap:balance}
.headline.quiet{color:var(--dim);font-weight:400}
.sum{display:flex;flex-wrap:wrap;gap:10px;margin:0 0 22px}
.sum .stat{flex:1 1 130px;background:var(--panel);border-left:3px solid var(--line2);
  padding:10px 14px}
.sum .stat.hit{border-left-color:var(--hot)}
.sum .stat.many{border-left-color:var(--warn)}
.sum .stat b{display:block;font-size:26px;font-weight:600;line-height:1.1}
.sum .stat.hit b{color:var(--hot)}
.sum .stat.many b{color:var(--warn)}
.sum .stat span{font-size:12px;color:var(--dim)}
.sum .stat em{font-style:normal;color:var(--hot);font-weight:600}
.since{font-size:14px;color:var(--dim);margin:0 0 24px}

.controls{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px}
input[type=search],select{background:var(--panel);color:var(--text);
  border:1px solid var(--line2);border-radius:2px;padding:8px 10px;
  font:inherit;font-size:14px}
input[type=search]{flex:1 1 200px;min-width:0}
select{flex:0 0 auto}
button{background:var(--panel);color:var(--text);border:1px solid var(--line2);
  border-radius:2px;padding:8px 12px;font:inherit;font-size:14px;cursor:pointer}
button:hover{border-color:var(--text)}
:focus-visible{outline:2px solid var(--warn);outline-offset:2px}

table{width:100%;border-collapse:collapse;margin-top:14px}
th{text-align:left;font-size:12px;font-weight:600;color:var(--dim);
  padding:0 8px 8px 0;border-bottom:1px solid var(--line2);white-space:nowrap;
  vertical-align:bottom}
th.n{text-align:right;padding-right:12px;white-space:normal;max-width:96px}
tr.grp td{padding:22px 0 6px;border-bottom:2px solid var(--line2);
  font-size:12px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;
  color:var(--text)}
tr.grp:first-child td{padding-top:4px}
tr.grp .gn{float:right;font-weight:400;letter-spacing:0;text-transform:none;
  color:var(--dim);font-size:12px}
tbody tr.b{border-bottom:1px solid var(--line);cursor:pointer}
tbody tr.b:hover td,tbody tr.b.open td{background:#131920}
td{padding:12px 8px 12px 0;font-size:15px;vertical-align:top}
td.n{text-align:right;padding-right:12px;font-weight:600;font-size:20px}
/* inherit, so a cell's tier colour carries through to the link inside it */
td a{color:inherit;text-decoration:none;border-bottom:1px solid var(--line2)}
td a:hover,td a:focus{border-bottom-color:currentColor}
td a:visited{color:inherit}
td.n.hot{color:var(--hot)}
td.n.many{color:var(--warn)}
td.n.zero{color:var(--faint)}
td.n.na{color:var(--warn)}
.of{display:block;font-size:11px;color:var(--faint);font-weight:400;margin-top:1px}
.delta{display:block;font-size:11px;font-weight:600;margin-top:1px;color:var(--hot)}
.delta.down{color:var(--cool)}
.name{font-weight:500}
.sub{display:block;font-size:12px;color:var(--faint);margin-top:3px}
.sub.err{color:var(--warn)}
.chev{display:inline-block;width:14px;color:var(--faint);font-size:12px}

tr.detail td{padding:0 0 18px;border-bottom:1px solid var(--line)}
.panel{background:var(--panel);padding:16px}
.panel h3{margin:0 0 2px;font-size:13px;font-weight:600;color:var(--dim)}
.charts{display:flex;flex-wrap:wrap;gap:18px;margin-top:10px}
.chart{flex:1 1 210px;min-width:180px}
.chart .cap{font-size:12px;color:var(--dim);margin-bottom:4px}
.chart .cap b{color:var(--text);font-size:15px;font-weight:600}
svg{display:block;width:100%;height:56px;overflow:visible}
.links{margin-top:14px;font-size:13px;display:flex;flex-wrap:wrap;gap:14px}
.links a{color:var(--text);text-decoration:none;border-bottom:1px solid var(--line2)}
.links a:hover{border-bottom-color:var(--text)}
.flat{font-size:13px;color:var(--faint);margin-top:10px}

.cx{margin-top:16px;border-top:1px solid var(--line2);padding-top:12px}
.cx h4{margin:0 0 8px;font-size:12px;font-weight:600;color:var(--dim)}
.cx label{display:flex;gap:10px;align-items:flex-start;padding:7px 0;
  border-bottom:1px solid var(--line);cursor:pointer;font-size:14px}
.cx label:last-of-type{border-bottom:0}
.cx input{margin:3px 0 0;flex:0 0 auto;width:15px;height:15px;accent-color:var(--cool)}
.cx .num{font-weight:600;min-width:74px}
.cx .meta{color:var(--faint);font-size:12px}
.cx a{color:var(--dim);text-decoration:none;border-bottom:1px solid var(--line2)}
.cx a:hover{color:var(--text)}
.cx .done{color:var(--cool);font-weight:600;font-size:12px}
.cx .row{display:flex;gap:10px;align-items:flex-start;padding:7px 0;
  border-bottom:1px solid var(--line);font-size:14px}
.cx .row:last-of-type{border-bottom:0}
.cx .flag{color:var(--warn);font-weight:600;font-size:11px;letter-spacing:.02em;
  border:1px solid var(--warn);padding:0 4px;margin-right:4px;white-space:nowrap}
.cx .flag.open{color:var(--hot);border-color:var(--hot)}
.cx .todo{color:var(--warn);font-weight:600;font-size:12px}
.save{position:sticky;bottom:0;margin-top:20px;background:var(--panel);
  border-top:2px solid var(--warn);padding:12px 16px;display:flex;flex-wrap:wrap;
  gap:10px;align-items:center;font-size:14px}
.save b{color:var(--warn);flex:0 0 auto}
.save span{flex:1 1 260px;line-height:1.5}
.save a.diag{color:var(--warn)}
.save input[type=text]{width:70px}

.msg{background:var(--panel);border-left:3px solid var(--warn);padding:14px 16px;
  font-size:14px;line-height:1.6}
.msg code{background:#0B0F13;padding:1px 5px;font-size:13px}
footer{margin-top:36px;font-size:13px;color:var(--faint);line-height:1.7}
@media(max-width:640px){
  td.n{font-size:17px;padding-right:6px}
  th.n{padding-right:6px}
  td{font-size:14px}
}
</style>
</head>
<body>
<div class="wrap">

<header>
  <h1>DOB Watch by JL</h1>
  <div class="stamp" id="stamp">Loading</div>
</header>

<div id="app">
  <p class="headline quiet">Loading</p>
</div>

<footer>
  Complaints column counts filings in the last 30 days; the other two count open records.
  Small number is everything on file.
  Click a building for its trend and links into BIS.
</footer>
</div>

<script>
const SEC = ["complaints","dob_violations","ecb_violations"];

// DOB's official complaint category list (nyc.gov/assets/buildings/pdf/complaint_category.pdf)
const CAT = {"1":"ACCIDENT - Construction/Plumbing","2":"ACCIDENT - To Public","3":"Adjacent Buildings - Not Protected","4":"After Hours Work - Illegal","5":"Permit - None (Building/PA/Demo etc.)","6":"CONSTRUCTION - Change Grade/Change Watercourse","7":"CONSTRUCTION - Change Watercourse","8":"Contractor's Sign - NONE","9":"Debris - Excessive","10":"Debris/Building - Falling or In Danger of Falling","11":"DEMOLITION - No Permit","12":"DEMOLITION - Unsafe/Illegal/Mechanical Demo","13":"Elevator In (FDNY) Readiness - NONE","14":"Excavation - Undermining Adjacent Building","15":"Fence - NONE/Inadequate/Illegal","16":"Inadequate Support/Shoring","17":"Material/Personnel Hoist - No Permit","18":"Material Storage - Unsafe","19":"Mechanical Demolition - Illegal","1A":"Illegal Conversion Commercial Building/Space to Dwelling Units","1B":"Illegal Tree Removal/Topo. Change in SNAD","1C":"Damage Assessment Request or Report (Disaster)","1D":"Con Edison Referral","1E":"Suspended (Hanging) Scaffolds - No Permit/License/Dangerous/Accident","1F":"Failure to Comply with Annual Crane Inspection","1G":"Stalled Construction Site","1H":"Emergency Asbestos Response Inspection","1J":"Jewelry/Dentistry Torch: Gas Piping Removed w/o Permit","1K":"Bowstring Truss Tracking Complaint","1L":"Gas Utility Referral","1U":"Special Operations Compliance Inspection","1V":"Electrical Enforcement Work Order (DOB)","1W":"Plumbing Enforcement Work Order (DOB)","1X":"Construction Enforcement Work Order (DOB)","1Y":"Enforcement Work Order (DOB)","1Z":"Enforcement Work Order (DOB)","20":"Landmark Building - ILLEGAL WORK","21":"Safety Net/Guard Rail - Damaged/Inadequate/NONE (over 6-stories/75FT)","22":"Safety Netting - NONE","23":"Sidewalk Shed/Supported Scaffold/Inadequate/Defect/NONE/NO PMT/NO CERT","24":"Sidewalk Shed - NONE","25":"Warning Signs/Lights - NONE","26":"Watchman - NONE","27":"Auto Repair - ILLEGAL","28":"BUILDING - In Danger of Collapse","29":"BUILDING - Vacant, Open and Unguarded","2A":"Posted Notice or Order Removed/Tampered With","2B":"Failure to Comply with Vacate Order","2C":"Smoking Ban - Smoking on Construction Site","2D":"Smoking Signs - NO SMOKING SIGNS Not Observed on Construction Site","2E":"Tracking Complaint for Full Demolition Notification","2F":"Building Under Structural Monitoring","2G":"Advertising Sign/Billboard/Posters/Flexible Fabric - ILLEGAL","2H":"Second Avenue Subway Construction","2J":"SANDY: Building Destroyed","2K":"Structurally Compromised Building (LL33/08)","2L":"Façade (LL11/98) - Unsafe Notification","2M":"Monopole Tracking Complaint","2N":"COVID-19 Executive Order","2P":"Façades Unit Compliance Inspection","30":"Building Shaking/Vibrating/Struct Stability Affected","31":"Certificate of Occupancy - None/ILLEGAL/Contrary to CO","32":"C of O - Not Being Complied With","33":"Commercial Use - ILLEGAL","34":"Compactor Room/Refuse Chute - ILLEGAL","35":"Curb Cut/Driveway/Carport - ILLEGAL","36":"Driveway/Carport - ILLEGAL","37":"Egress: Locked/Blocked/Improper/No Secondary Means","38":"Egress: Exit Door Not Proper","39":"Egress: No Secondary Means","3A":"Unlicensed/ILLEGAL/Improper Electrical Work in Progress","3B":"Routine Inspection","3C":"Plan Compliance Inspection","3D":"Bicycle Access Waiver Request - Elevator Safety","3E":"Bicycle Access Waiver Request - Alternate Parking","3G":"Restroom Non-Compliance with Local Law 79/16","3H":"DCP/BSA Compliance Inspection","40":"Falling - Part of Building","41":"Falling - Part of Building in Danger of","42":"Fence - ILLEGAL","43":"Structural Stability Affected","44":"Fireplace/Wood Stove - ILLEGAL","45":"Illegal Conversion +","46":"PA Permit - None","47":"PA Permit - Not Being Complied With","48":"Residential Use - ILLEGAL","49":"Storefront or Business Sign/Awning/Marquee/Canopy - ILLEGAL","4A":"Illegal Hotel Rooms in Residential Buildings","4B":"SEP - Professional Certification Compliance Audit","4E":"Stalled Sites Tracking Complaint","4G":"Illegal Conversion No Access Follow-Up","4H":"V.E.S.T. Program (DOB & NYPD)","4J":"M.A.R.C.H. Program (INTERAGENCY)","4K":"CSC: DM Tracking Complaint","4L":"CSC: High-Rise Tracking Complaint","4M":"CSC: Low-Rise Tracking Complaint","4N":"Retaining Wall Tracking Complaint","4P":"Legal/Padlock Tracking Complaint","4S":"Sustainability Enforcement Work Order","4W":"Woodside Settlement Project","4X":"After Hours Work - With an AHV Permit","50":"Sign Falling: Danger/Sign Erection or Display In-Progress (ILLEGAL)","51":"Illegal Social Club","52":"Sprinkler System - Inadequate","53":"Vent/Exhaust - Illegal/Improper","54":"Wall/Retaining Wall - Bulging/Cracked","55":"Zoning: Non-Conforming","56":"Boiler: Fumes/Smoke/Carbon Monoxide","57":"Boiler: Illegal","58":"Boiler: Defective/Inoperative/No Permit","59":"Electrical Wiring: Defective/Exposed - In Progress","5A":"Request for Joint FDNY/DOB Inspection","5B":"Non-Compliance: with Lightweight Materials","5C":"Structural Stability Impacted - New Building Under Construction","5D":"Non-Compliance: with TPPN 1/00 - Vertical Enlargements","5E":"Amusement Ride Accident/Incident","5F":"Compliance Inspection","5G":"Unlicensed/Illegal/Improper Work In-Progress","5H":"Illegal Activity","5J":"Multi Agency Joint Inspection","60":"Electrical Work: Improper","61":"Electrical Work: Unlicensed, In-Progress","62":"Elevator: Danger Condition/Shaft Open/Unguarded","63":"Elevator: Defective/Inoperative","64":"Elevator Shaft: Open and Unguarded","65":"Gas Hook-Up/Piping - Illegal or Defective","66":"Plumbing Work - Illegal/No Permit (also Sprinkler/Standpipe)","67":"Crane: No Permit/License/Cert/Unsafe/Illegal","68":"Crane/Scaffold: Unsafe/Illegal Operations","69":"Crane/Scaffold: Unsafe Installation/Equipment","6A":"Vesting Inspection","6B":"Semi-Annual Homeless Shelter Inspection: Plumbing","6C":"Semi-Annual Homeless Shelter Inspection: Construction","6D":"Semi-Annual Homeless Shelter Inspection: Electrical","6M":"Elevator: Multiple Devices on Property","6S":"Elevator: Single Device on Property/No Alternate Service","6V":"Tenant Safety Inspection","6W":"Tenant Safety - Failure to Post/Distribute","6X":"Work Without Permits Watch List Compliance","6Y":"Local Law Audits","6Z":"Training Compliance","70":"Suspension Scaffold Hanging - No Work In-Progress","71":"SRO: Illegal Work/No Permit/Change in Occupancy Use +","72":"SRO: Change in Occupancy/Use","73":"Failure to Maintain","74":"Illegal Commercial/Manufacturing Use in Residential Zone","75":"Adult Establishment","76":"Unlicensed/Illegal/Improper Plumbing Work In-Progress","77":"Contrary to LL58/87 (Handicap Access)","78":"Privately Owned Public Space/Non-Compliance","79":"Lights from Parking Lot Shining on Building","7A":"Integrity Complaint Referral","7B":"Illegal Commercial or Manufacturing Use in a C1 or C2 Zone","7F":"CSE: Tracking Compliance","7G":"CSE: Sweep","7J":"Work Without a Permit - Occupied Multiple Dwelling","7K":"Local Law 188/17 Compliance Inspections - Active Jobs","7L":"DOHMH Referral - Tenant Protection Non-Compliance","7N":"Privately Owned Public Space/Compliance Inspection","80":"Elevator Not Inspected/Illegal/No Permit","81":"Elevator: Accident","82":"Boiler: Accident/Explosion","83":"Construction: Contrary/Beyond Approved Plans/Permits +","84":"Façade: Defective/Cracking","85":"Failure to Retain Water/Improper Drainage (LL103/89)","86":"Work Contrary to Stop Work Order","87":"Request for Deck Safety Inspection","88":"Safety Net/Guard Rail - Damaged/Inadequate/None (6-stories 75FT or Less)","89":"Accident - Cranes/Derricks/Suspension","8A":"Construction Safety Compliance (CSC) Action","90":"Unlicensed/Illegal Activity","91":"Site Conditions Endangering Workers","92":"Illegal Conversion of Manufacturing/Industrial Space","93":"Request for Retaining Wall Safety Inspection","94":"Plumbing: Defective/Leaking/Not Maintained","95":"Bronx 2nd Offense Pilot Project","96":"Unlicensed Boiler, Electrical, Plumbing or Sign Work Completed","97":"Other Agency Jurisdiction","98":"Refer to Operations for Determination","99":"Other"};
const catName = c => {
  const k = String(c || "").trim().toUpperCase();
  return CAT[k] || CAT[k.replace(/^0+/, "")] || "";
};
const NAME = {complaints:"Complaints (30d)", dob_violations:"Violations-DOB", ecb_violations:"Violations-OATH/ECB"};
const VERB = {complaints:"filed in last 30 days", dob_violations:"open", ecb_violations:"open"};
const app = document.getElementById("app");
const stamp = document.getElementById("stamp");

let EMBEDDED = null;
let DATA = null, expanded = null;

// Who verified what. Stored in a Google Sheet behind an Apps Script web app,
// so a tick saves instantly and everyone sees it. Paste your /exec URL here.
const SHEET_URL = "PASTE_YOUR_EXEC_URL_HERE";
let STATUS = {}, WHO = "", SAVING = 0, SAVE_ERR = "";
try { WHO = localStorage.getItem("dobwatch_who") || ""; } catch (e) {}
const ui = {q:"", sort:"moved", group:"all", cat:"all"};

// data.json sits next to this page. ?src=<url> points somewhere else,
// e.g. a raw.githubusercontent.com URL when you open this file locally.
const src = new URLSearchParams(location.search).get("src") || "data.json";

function esc(s){return String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));}

/**
 * Complaints still needing attention: filed in the window and not yet ticked
 * as verified. The other two sections use the count as published.
 */
function openCount(b, sec){
  const s = b.sections[sec];
  if (typeof s?.open !== "number") return null;
  const recs = s.records;
  if (!Array.isArray(recs)) return s.open;
  // complaints and OATH/ECB are both worklists: a row drops out once someone
  // has checked it against BIS and ticked it
  if (sec === "complaints" || sec === "ecb_violations")
    return recs.filter(r => !STATUS[r.num]?.resolved).length;
  return s.open;
}

function prevCounts(){
  const h = DATA.history || [];
  return h.length > 1 ? h[h.length-2].counts || {} : {};
}
function seriesFor(id, sec){
  return (DATA.history||[]).map(h => (h.counts?.[id]?.[sec] ?? null));
}

function openTotal(){
  let n = 0;
  for (const b of DATA.buildings)
    for (const s of SEC) { const v = openCount(b, s); if (v !== null) n += v; }
  return n;
}

function deltas(b){
  const p = prevCounts()[b.id] || {};
  const out = {};
  for (const s of SEC){
    const now = b.sections[s]?.open, was = p[s];
    out[s] = (typeof now === "number" && typeof was === "number" && now !== was) ? now - was : 0;
  }
  return out;
}

function sparkline(vals){
  const v = vals.filter(x => typeof x === "number");
  if (v.length < 2) return '<p class="flat">Not enough history yet.</p>';
  const w = 200, h = 46, lo = Math.min(...v), hi = Math.max(...v), span = hi - lo || 1;
  const pts = v.map((y,i) => [i*(w/(v.length-1)), h - ((y-lo)/span)*(h-6) - 3]);
  const d = pts.map((p,i) => (i?"L":"M") + p[0].toFixed(1) + " " + p[1].toFixed(1)).join(" ");
  const last = pts[pts.length-1];
  const rising = v[v.length-1] > v[0];
  const col = rising ? "var(--hot)" : "var(--cool)";
  return `<svg viewBox="0 0 ${w} ${h}" preserveAspectRatio="none" role="img"
    aria-label="${v.length} readings, ${v[0]} to ${v[v.length-1]}">
    <path d="${d}" fill="none" stroke="${col}" stroke-width="1.5"
      vector-effect="non-scaling-stroke"/>
    <circle cx="${last[0].toFixed(1)}" cy="${last[1].toFixed(1)}" r="2.5" fill="${col}"/>
  </svg>`;
}

function detailRow(b){
  const charts = SEC.map(s => {
    const n = openCount(b, s);
    const recs = b.sections[s]?.records;
    const cap = Array.isArray(recs)
      ? `<b>${n}</b> of ${recs.length} ${s === "complaints"
            ? "filed in last 30 days still to verify" : "OATH/ECB still to verify"}`
      : `<b>${n === null ? "n/a" : n}</b> ${esc(NAME[s])} ${esc(VERB[s])}`;
    return `<div class="chart"><div class="cap">${cap}</div>
      ${sparkline(seriesFor(b.id, s))}</div>`;
  }).join("");
  let recs = b.sections.complaints?.records || [];
  if (ui.cat !== "all")
    recs = recs.filter(r => String(r.category || "").trim().toUpperCase() === ui.cat);
  const cx = recs.length ? `<div class="cx">
    <h4>Complaints filed in the last 30 days &mdash; tick once you have checked BIS</h4>
    ${recs.map(r => {
      const st = STATUS[r.num];
      const done = st && st.resolved;
      return `<label>
        <input type="checkbox" data-num="${esc(r.num)}"${done ? " checked" : ""}>
        <span>
          <span class="num">${esc(r.num)}</span>
          <span class="${done ? "done" : "todo"}">${done ? "RESOLVED" : "PENDING"}</span>
          <span class="meta"> &middot; filed ${esc(r.date)}${r.category ? " &middot; " + esc(catName(r.category) || "cat " + r.category) : ""}
            &middot; <a href="${esc(r.url)}" target="_blank" rel="noopener">open on BIS</a>
            ${done && st.by ? " &middot; by " + esc(st.by) : ""}${done && st.at ? " on " + esc(st.at) : ""}</span>
        </span></label>`;
    }).join("")}
  </div>` : "";

  const ecb = b.sections.ecb_violations?.records || [];
  const money = n => "$" + Number(n || 0).toLocaleString("en-US", {minimumFractionDigits: 2});
  const ex = ecb.length ? `<div class="cx">
    <h4>OATH/ECB violations needing attention &mdash; tick once you have checked BIS</h4>
    ${ecb.map(v => {
      const st = STATUS[v.num];
      const done = st && st.resolved;
      const flags = done ? "" : v.flags.map(f =>
        `<span class="flag${f === "OPEN" ? " open" : ""}">${esc(f)}${
          f === "HEARING PENDING" && v.hearing_date ? " " + esc(v.hearing_date) : ""}${
          f.startsWith("BALANCE") ? " " + esc(money(v.balance)) : ""}</span>`).join("");
      return `<label>
        <input type="checkbox" data-num="${esc(v.num)}"${done ? " checked" : ""}>
        <span>
          <span class="num">${esc(v.num)}</span>
          ${done ? `<span class="done">CONFIRMED RESOLVED</span>` : flags}
          <span class="meta"> &middot; DOB says ${esc(v.status || "?")} &middot; issued ${esc(v.date || "?")}${
            v.severity ? " &middot; " + esc(v.severity) : ""}${
            v.hearing_date ? " &middot; hearing " + esc(v.hearing_date) + (v.hearing_status ? " (" + esc(v.hearing_status.toLowerCase()) + ")" : " (no status)") : ""}${
            v.url ? ` &middot; <a href="${esc(v.url)}" target="_blank" rel="noopener">open on BIS</a>` : ""}${
            done && st.by ? " &middot; by " + esc(st.by) : ""}</span>
        </span></label>`;
    }).join("")}
  </div>` : "";

  const links = SEC.filter(s => b.sections[s]?.url)
    .map(s => `<a href="${esc(b.sections[s].url)}" target="_blank" rel="noopener">${esc(NAME[s])} on BIS</a>`)
    .join("");
  const prof = b.profile_url
    ? `<a href="${esc(b.profile_url)}" target="_blank" rel="noopener">Property profile</a>` : "";
  const errs = SEC.filter(s => b.sections[s]?.error)
    .map(s => `${NAME[s]}: ${b.sections[s].error}`).join(" / ");
  return `<tr class="detail"><td colspan="4"><div class="panel">
    <h3>${esc(b.label)}${b.bin ? " &middot; BIN " + esc(b.bin) : ""}</h3>
    <div class="charts">${charts}</div>
    ${errs ? `<p class="flat" style="color:var(--warn)">${esc(errs)}</p>` : ""}
    <div class="links">${prof}${links}</div>
    ${cx}${ex}
  </div></td></tr>`;
}

function render(){
  if (!DATA) return;
  stamp.innerHTML = `Checked <b>${esc(DATA.checked_at)}</b> via ${DATA.source === "bis" ? "BIS" : "NYC Open Data"}`;

  const movedList = DATA.buildings.filter(b => Object.values(deltas(b)).some(d => d !== 0));

  // portfolio totals, and how many of each arrived since the last check
  const tot = {}, fresh = {};
  for (const s of SEC) { tot[s] = 0; fresh[s] = 0; }
  for (const b of DATA.buildings) {
    const d = deltas(b);
    for (const s of SEC) {
      const v = openCount(b, s);
      if (v !== null) tot[s] += v;
      if (d[s] > 0) fresh[s] += d[s];
    }
  }
  const CAPTION = {complaints:"complaints to verify", dob_violations:"open Violations-DOB",
                   ecb_violations:"OATH/ECB to verify"};
  const stats = SEC.map(s => {
    const n = tot[s];
    const cls = n === 0 ? "" : " many";
    const add = fresh[s] ? `<em>+${fresh[s]} new</em> &middot; ` : "";
    return `<div class="stat${cls}"><b>${n}</b><span>${add}${CAPTION[s]}</span></div>`;
  }).join("")
  // penalties still unpaid more than 3 days after the hearing concluded
  + (() => {
      let n = 0;
      for (const b of DATA.buildings)
        for (const v of (b.sections.ecb_violations?.records || []))
          if (v.overdue && !STATUS[v.num]?.resolved) n++;
      return `<div class="stat${n ? " many" : ""}"><b>${n}</b>` +
             `<span>penalties unpaid 3+ days</span></div>`;
    })();

  const newBits = SEC.filter(s => fresh[s] > 0)
    .map(s => `${fresh[s]} new ${s === "complaints"
        ? (fresh[s] === 1 ? "complaint" : "complaints") : NAME[s]}`);
  const head = (newBits.length
    ? `<p class="headline">${newBits.join(", ")} since the last check.</p>`
    : `<p class="headline quiet">Nothing new since the last check.</p>`)
    + `<div class="sum">${stats}</div>`;
  const since = (DATA.history||[]).length > 1
    ? `<p class="since">Compared against the previous check. ${DATA.history.length} readings on file.</p>`
    : `<p class="since">First reading. New items show from the next check.</p>`;

  const q = ui.q.trim().toLowerCase();
  let rows = DATA.buildings.filter(b =>
    !q || b.label.toLowerCase().includes(q) || String(b.bin||"").includes(q));

  const openOf = (b,s) => { const v = openCount(b, s); return v === null ? -1 : v; };
  const biggest = b => Math.max(...Object.values(deltas(b)).map(Math.abs));
  const sorters = {
    moved: (a,b) => biggest(b) - biggest(a) || a.label.localeCompare(b.label),
    name:  (a,b) => a.label.localeCompare(b.label),
    complaints: (a,b) => openOf(b,"complaints") - openOf(a,"complaints"),
    dob_violations: (a,b) => openOf(b,"dob_violations") - openOf(a,"dob_violations"),
    ecb_violations: (a,b) => openOf(b,"ecb_violations") - openOf(a,"ecb_violations"),
  };
  rows = rows.slice().sort(sorters[ui.sort] || sorters.name);

  const groupsAll = [...new Set(DATA.buildings.map(b => b.group || "Other"))];
  if (ui.group !== "all" && !groupsAll.includes(ui.group)) ui.group = "all";
  if (ui.group !== "all") rows = rows.filter(b => (b.group || "Other") === ui.group);

  // complaint types actually present in the current data, so the list stays short
  const catsAll = [...new Set(DATA.buildings.flatMap(b =>
    (b.sections.complaints?.records || []).map(r => String(r.category || "").trim().toUpperCase())
  ))].filter(Boolean).sort((a, b) => (catName(a) || a).localeCompare(catName(b) || b));
  if (ui.cat !== "all" && !catsAll.includes(ui.cat)) ui.cat = "all";
  if (ui.cat !== "all") rows = rows.filter(b =>
    (b.sections.complaints?.records || [])
      .some(r => String(r.category || "").trim().toUpperCase() === ui.cat));

  const rowHtml = b => {
    const d = deltas(b);
    const cells = SEC.map(s => {
      const v = b.sections[s];
      const n = openCount(b, s);
      if (n === null) return `<td class="n na">n/a</td>`;
      // hide the delta on complaints once ticks have adjusted the number,
      // otherwise you get a confusing "0 (+1)"
      const adjusted = s === "complaints" && n !== v.open;
      const dd = (d[s] && !adjusted)
        ? `<span class="delta${d[s]<0?" down":""}">${d[s]>0?"+":""}${d[s]}</span>` : "";
      const inner = v.url ? `<a href="${esc(v.url)}">${n}</a>` : n;
      const tone = n === 0 ? "zero" : "many";
      return `<td class="n ${tone}">${inner}
        <span class="of">of ${v.total ?? "?"}</span>${dd}</td>`;
    }).join("");
    const sub = b.error
      ? `<span class="sub err">${esc(b.error)}</span>`
      : `<span class="sub">${b.bin ? "BIN "+esc(b.bin) : "no BIN"}</span>`;
    const isOpen = expanded === b.id;
    return `<tr class="b${isOpen?" open":""}" data-id="${esc(b.id)}" tabindex="0"
        aria-expanded="${isOpen}">
      <td><span class="chev">${isOpen?"&#9662;":"&#9656;"}</span><span class="name">${esc(b.label)}</span>${sub}</td>
      ${cells}</tr>` + (isOpen ? detailRow(b) : "");
  };

  // banners follow the order groups appear in buildings.json, not the sort order
  const present = groupsAll.filter(g => rows.some(b => (b.group || "Other") === g));
  const body = present.map(g => {
    const inGroup = rows.filter(b => (b.group || "Other") === g);
    const n = inGroup.length;
    return `<tr class="grp"><td colspan="4">${esc(g)}` +
           `<span class="gn">${n} building${n === 1 ? "" : "s"}</span></td></tr>` +
           inGroup.map(rowHtml).join("");
  }).join("");

  // which buildings owe money, and how much
  const owed = [];
  let owedTotal = 0;
  for (const b of DATA.buildings) {
    const rows = (b.sections.ecb_violations?.records || [])
      .filter(v => Number(v.balance) > 0 && !STATUS[v.num]?.resolved);
    if (!rows.length) continue;
    const sum = rows.reduce((a, v) => a + Number(v.balance || 0), 0);
    owedTotal += sum;
    owed.push({id: b.id, label: b.label, n: rows.length, sum,
               overdue: rows.some(v => v.overdue)});
  }
  owed.sort((a, b) => b.sum - a.sum);
  const cash = n => "$" + Number(n).toLocaleString("en-US", {minimumFractionDigits: 2});
  const owedBlock = owed.length ? `<div class="owed">
    <h4>Buildings with an unpaid penalty balance</h4>
    ${owed.map(o => `<div class="who">
      <button class="link" data-go="${esc(o.id)}">${esc(o.label)}</button>
      <span class="amt">${cash(o.sum)} &middot; ${o.n} violation${o.n === 1 ? "" : "s"}${
        o.overdue ? " &middot; overdue" : ""}</span></div>`).join("")}
    <div class="tot"><span>Total</span><span class="amt">${cash(owedTotal)}</span></div>
  </div>` : "";

  app.innerHTML = head + since + owedBlock + `
  <div class="controls">
    <input type="search" id="q" placeholder="Filter by address or BIN" value="${esc(ui.q)}">
    <select id="grp"></select>
    <select id="cat"></select>
    <select id="sort">
      <option value="moved">Sort: recent movement</option>
      <option value="name">Sort: address</option>
      <option value="complaints">Sort: recent complaints</option>
      <option value="dob_violations">Sort: open Violations-DOB</option>
      <option value="ecb_violations">Sort: open Violations-OATH/ECB</option>
    </select>
    <input type="text" id="who" placeholder="Your initials" value="${esc(WHO)}"
           style="flex:0 0 110px">
    <button id="reload">Reload</button>
  </div>
  <table><thead><tr>
    <th>Building</th><th class="n">Complaints (30d)</th><th class="n">Violations-DOB</th><th class="n">Violations-OATH/ECB</th>
  </tr></thead><tbody>${body || `<tr><td colspan="4" class="flat">No building matches that filter.</td></tr>`}</tbody></table>`;

  if (SAVING || SAVE_ERR) {
    const bar = document.createElement("div");
    bar.className = "save";
    bar.innerHTML = SAVE_ERR
      ? `<b>Not saved</b> <span>${esc(SAVE_ERR)}</span>`
      : `<b>Saving</b> <span>writing to the shared sheet</span>`;
    app.appendChild(bar);
  }

  const qs = document.getElementById("q");
  qs.addEventListener("input", e => { ui.q = e.target.value; render();
    const n = document.getElementById("q"); n.focus(); n.setSelectionRange(n.value.length, n.value.length); });
  const gsel = document.getElementById("grp");
  gsel.innerHTML = [`<option value="all">All properties</option>`]
    .concat(groupsAll.map(g => `<option value="${esc(g)}">${esc(g)}</option>`)).join("");
  gsel.value = ui.group;
  gsel.addEventListener("change", e => { ui.group = e.target.value; render(); });

  const csel = document.getElementById("cat");
  csel.innerHTML = [`<option value="all">All complaint types</option>`]
    .concat(catsAll.map(c =>
      `<option value="${esc(c)}">${esc(catName(c) || "Category " + c)}</option>`)).join("");
  csel.value = ui.cat;
  csel.disabled = catsAll.length === 0;
  csel.addEventListener("change", e => { ui.cat = e.target.value; render(); });

  const sel = document.getElementById("sort");
  sel.value = ui.sort;
  sel.addEventListener("change", e => { ui.sort = e.target.value; render(); });
  document.getElementById("who").addEventListener("input", e => {
    WHO = e.target.value.slice(0, 12);
    try { localStorage.setItem("dobwatch_who", WHO); } catch (err) {}
  });
  document.getElementById("reload").addEventListener("click", load);

  app.querySelectorAll(".owed button[data-go]").forEach(btn => {
    btn.addEventListener("click", () => {
      expanded = btn.dataset.go;
      render();
      const row = app.querySelector(`tr.b[data-id="${CSS.escape(expanded)}"]`);
      if (row) row.scrollIntoView({behavior: "smooth", block: "center"});
    });
  });

  app.querySelectorAll(".cx input[type=checkbox]").forEach(cb => {
    cb.addEventListener("click", e => e.stopPropagation());
    cb.addEventListener("change", e => {
      e.stopPropagation();
      const num = cb.dataset.num;
      if (cb.checked) STATUS[num] = {resolved:true, by:WHO||"", at:new Date().toISOString().slice(0,10)};
      else delete STATUS[num];
      render();
      saveTick(num, cb.checked);
    });
  });

  app.querySelectorAll("tr.b").forEach(tr => {
    const toggle = () => { expanded = expanded === tr.dataset.id ? null : tr.dataset.id; render(); };
    tr.addEventListener("click", toggle);
    tr.addEventListener("keydown", e => {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggle(); }
    });
  });
}

/**
 * Apps Script sends no CORS header, so fetch() to it always fails. JSONP loads
 * the reply as a script tag, which browsers allow across origins. Reads and
 * writes both go through here.
 */
let jsonpSeq = 0;

/**
 * Talk to the Apps Script web app. Reads and writes both go through a plain
 * GET, which is a simple request and needs no preflight.
 *
 * fetch is tried first. If the browser blocks it, fall back to JSONP, which
 * loads the reply as a script tag. Some setups block one and allow the other,
 * so having both means neither failure mode takes the page down.
 */
async function callSheet(params){
  const q = new URLSearchParams({...params, t: Date.now()});
  try {
    const r = await fetch(SHEET_URL + "?" + q.toString(),
                          {cache: "no-store", redirect: "follow"});
    if (!r.ok) throw new Error("HTTP " + r.status);
    return await r.json();
  } catch (err) {
    return await callSheetJsonp(params);
  }
}

function callSheetJsonp(params){
  return new Promise((resolve, reject) => {
    const cb = "dobwatch_cb_" + (++jsonpSeq);
    const q = new URLSearchParams({...params, callback: cb, t: Date.now()});
    const s = document.createElement("script");
    const timer = setTimeout(() => { cleanup(); reject(new Error("timed out")); }, 20000);
    function cleanup(){
      clearTimeout(timer);
      delete window[cb];
      if (s.parentNode) s.parentNode.removeChild(s);
    }
    window[cb] = data => { cleanup(); resolve(data); };
    s.onerror = () => { cleanup(); reject(new Error("could not reach the sheet")); };
    s.src = SHEET_URL + "?" + q.toString();
    document.head.appendChild(s);
  });
}

const NOT_WIRED = () => !SHEET_URL || SHEET_URL.startsWith("PASTE_");

async function loadStatus(){
  if (NOT_WIRED()) {
    SAVE_ERR = "SHEET_URL is still the placeholder in index.html";
    return;
  }
  try {
    const j = await callSheet({});
    if (j.ok) { STATUS = j.status || {}; SAVE_ERR = ""; }
    else SAVE_ERR = j.error || "the sheet returned an error";
  } catch (err) {
    SAVE_ERR = await diagnose(err);
  }
}

/**
 * JSONP failures give no detail, so fetch the same URL and look at what
 * actually comes back. Turns "could not reach the sheet" into the reason.
 */
async function diagnose(err){
  const url = SHEET_URL + "?callback=test";
  try {
    const r = await fetch(url, {redirect: "follow"});
    const body = (await r.text()).trim();
    if (body.startsWith("test(") || body.startsWith("{")) {
      return "the sheet replied but the page could not read it. Reload once; "
           + "if it persists, try another browser or disable extensions here.";
    }
    if (body.startsWith("{")) {
      return "the deployed script is an OLD VERSION: it ignores the callback "
           + "parameter. In Apps Script go to Deploy, Manage deployments, pencil "
           + "icon, Version: New version, Deploy.";
    }
    if (/<html|sign ?in|accounts\.google/i.test(body)) {
      return "the URL returns a Google sign-in page. In Manage deployments set "
           + "\"Who has access\" to Anyone.";
    }
    return "unexpected reply from the sheet: " + body.slice(0, 120);
  } catch (e2) {
    return "could not reach " + SHEET_URL.slice(0, 60) + "... "
         + "Open that URL in a tab. If it does not return JSON, the URL in "
         + "index.html is not the current deployment. (" + err.message + ")";
  }
}

async function saveTick(num, resolved){
  if (NOT_WIRED()) {
    SAVE_ERR = "SHEET_URL is not set in index.html, so nothing was saved";
    render(); return;
  }
  SAVING++; SAVE_ERR = ""; render();
  try {
    const j = await callSheet({num, resolved: String(resolved), by: WHO});
    if (j.ok) STATUS = j.status || {};
    else SAVE_ERR = j.error || "the sheet refused the write";
  } catch (err) {
    SAVE_ERR = "save failed: " + err.message;
  } finally { SAVING--; render(); }
}

async function load(){
  if (EMBEDDED) { DATA = EMBEDDED; render(); return; }
  try {
    const r = await fetch(src + (src.includes("?") ? "&" : "?") + "t=" + Date.now(),
                          {cache:"no-store"});
    if (!r.ok) throw new Error("HTTP " + r.status);
    DATA = await r.json();
    await loadStatus();
    render();
  } catch (err) {
    stamp.textContent = "No data";
    app.innerHTML = `<p class="headline quiet">No results yet.</p>
      <div class="msg">Could not read <code>${esc(src)}</code>: ${esc(err.message)}.<br><br>
      This page reads <code>data.json</code> from the same folder. Run the checker once
      so it publishes that file, then reload.<br><br>
      Opening this file straight off your desktop? Browsers block local file reads.
      Either use the GitHub Pages URL, or append
      <code>?src=</code> and a raw.githubusercontent.com link to data.json.</div>`;
  }
}
load();

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DOB Watch by JL</title>
<style>
:root{
  --ink:#0E1216; --panel:#161B21; --line:#232B33; --line2:#2E3841;
  --text:#E9E7E2; --dim:#8B939B; --faint:#666E76;
  --hot:#E2564D; --cool:#5E9E7B; --warn:#D9A441;
}
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--ink);color:var(--text);
  font:16px/1.5 "Helvetica Neue",Helvetica,Arial,sans-serif;
  font-variant-numeric:tabular-nums}
.wrap{max-width:960px;margin:0 auto;padding:28px 20px 80px}

header{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:baseline;
  justify-content:space-between;border-bottom:2px solid var(--text);
  padding-bottom:12px;margin-bottom:24px}
h1{margin:0;font-size:21px;font-weight:600;letter-spacing:-.01em}
.stamp{font-size:13px;color:var(--dim)}
.stamp b{color:var(--text);font-weight:600}

.headline{font-size:clamp(25px,4.6vw,36px);line-height:1.18;font-weight:600;
  letter-spacing:-.02em;margin:0 0 8px;max-width:24ch}
.headline.quiet{color:var(--dim);font-weight:400}
.since{font-size:14px;color:var(--dim);margin:0 0 24px}

.controls{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:6px}
input[type=search],select{background:var(--panel);color:var(--text);
  border:1px solid var(--line2);border-radius:2px;padding:8px 10px;
  font:inherit;font-size:14px}
input[type=search]{flex:1 1 200px;min-width:0}
select{flex:0 0 auto}
button{background:var(--panel);color:var(--text);border:1px solid var(--line2);
  border-radius:2px;padding:8px 12px;font:inherit;font-size:14px;cursor:pointer}
button:hover{border-color:var(--text)}
:focus-visible{outline:2px solid var(--warn);outline-offset:2px}

table{width:100%;border-collapse:collapse;margin-top:14px}
th{text-align:left;font-size:12px;font-weight:600;color:var(--dim);
  padding:0 8px 8px 0;border-bottom:1px solid var(--line2);white-space:nowrap;
  vertical-align:bottom}
th.n{text-align:right;padding-right:12px;white-space:normal;max-width:96px}
tbody tr.b{border-bottom:1px solid var(--line);cursor:pointer}
tbody tr.b:hover td,tbody tr.b.open td{background:#131920}
td{padding:12px 8px 12px 0;font-size:15px;vertical-align:top}
td.n{text-align:right;padding-right:12px;font-weight:600;font-size:20px}
td.n.hot{color:var(--hot)}
td.n.zero{color:var(--faint)}
td.n.na{color:var(--warn)}
.of{display:block;font-size:11px;color:var(--faint);font-weight:400;margin-top:1px}
.delta{display:block;font-size:11px;font-weight:600;margin-top:1px;color:var(--hot)}
.delta.down{color:var(--cool)}
.name{font-weight:500}
.sub{display:block;font-size:12px;color:var(--faint);margin-top:3px}
.sub.err{color:var(--warn)}
.chev{display:inline-block;width:14px;color:var(--faint);font-size:12px}

tr.detail td{padding:0 0 18px;border-bottom:1px solid var(--line)}
.panel{background:var(--panel);padding:16px}
.panel h3{margin:0 0 2px;font-size:13px;font-weight:600;color:var(--dim)}
.charts{display:flex;flex-wrap:wrap;gap:18px;margin-top:10px}
.chart{flex:1 1 210px;min-width:180px}
.chart .cap{font-size:12px;color:var(--dim);margin-bottom:4px}
.chart .cap b{color:var(--text);font-size:15px;font-weight:600}
svg{display:block;width:100%;height:56px;overflow:visible}
.links{margin-top:14px;font-size:13px;display:flex;flex-wrap:wrap;gap:14px}
.links a{color:var(--text);text-decoration:none;border-bottom:1px solid var(--line2)}
.links a:hover{border-bottom-color:var(--text)}
.flat{font-size:13px;color:var(--faint);margin-top:10px}

.msg{background:var(--panel);border-left:3px solid var(--warn);padding:14px 16px;
  font-size:14px;line-height:1.6}
.msg code{background:#0B0F13;padding:1px 5px;font-size:13px}
footer{margin-top:36px;font-size:13px;color:var(--faint);line-height:1.7}
@media(max-width:640px){
  td.n{font-size:17px;padding-right:6px}
  th.n{padding-right:6px}
  td{font-size:14px}
}
</style>
</head>
<body>
<div class="wrap">

<header>
  <h1>DOB Watch by JL</h1>
  <div class="stamp" id="stamp">Loading</div>

<div id="app">

<footer>

    complaints: (a,b) => openOf(b,"complaints") - openOf(a,"complaints"),
    dob_violations: (a,b) => openOf(b,"dob_violations") - openOf(a,"dob_violations"),
    ecb_violations: (a,b) => openOf(b,"ecb_violations") - openOf(a,"ecb_violations"),
  };
  rows = rows.slice().sort(sorters[ui.sort] || sorters.name);

  const body = rows.map(b => {
    const d = deltas(b);
    const cells = SEC.map(s => {
      const v = b.sections[s];
      if (typeof v?.open !== "number") return `<td class="n na">n/a</td>`;
      const dd = d[s]
        ? `<span class="delta${d[s]<0?" down":""}">${d[s]>0?"+":""}${d[s]}</span>` : "";
      return `<td class="n ${v.open?"hot":"zero"}">${v.open}
        <span class="of">of ${v.total ?? "?"}</span>${dd}</td>`;
    }).join("");
    const sub = b.error
      ? `<span class="sub err">${esc(b.error)}</span>`
      : `<span class="sub">${b.bin ? "BIN "+esc(b.bin) : "no BIN"}</span>`;
    const isOpen = expanded === b.id;
    return `<tr class="b${isOpen?" open":""}" data-id="${esc(b.id)}" tabindex="0"
        aria-expanded="${isOpen}">
      <td><span class="chev">${isOpen?"&#9662;":"&#9656;"}</span><span class="name">${esc(b.label)}</span>${sub}</td>
      ${cells}</tr>` + (isOpen ? detailRow(b) : "");
  }).join("");

  app.innerHTML = head + since + `
  <div class="controls">
    <input type="search" id="q" placeholder="Filter by address or BIN" value="${esc(ui.q)}">
    <select id="sort">
      <option value="moved">Sort: recent movement</option>
      <option value="name">Sort: address</option>
      <option value="complaints">Sort: recent complaints</option>
      <option value="dob_violations">Sort: open Violations-DOB</option>
      <option value="ecb_violations">Sort: open Violations-OATH/ECB</option>
    </select>
    <button id="reload">Reload</button>
  </div>
  <table><thead><tr>
    <th>Building</th><th class="n">Complaints (30d)</th><th class="n">Violations-DOB</th><th class="n">Violations-OATH/ECB</th>
  </tr></thead><tbody>${body || `<tr><td colspan="4" class="flat">No building matches that filter.</td></tr>`}</tbody></table>`;

  const qs = document.getElementById("q");
  qs.addEventListener("input", e => { ui.q = e.target.value; render();
    const n = document.getElementById("q"); n.focus(); n.setSelectionRange(n.value.length, n.value.length); });
  const sel = document.getElementById("sort");
  sel.value = ui.sort;
  sel.addEventListener("change", e => { ui.sort = e.target.value; render(); });
  document.getElementById("reload").addEventListener("click", load);

  app.querySelectorAll("tr.b").forEach(tr => {
    const toggle = () => { expanded = expanded === tr.dataset.id ? null : tr.dataset.id; render(); };
    tr.addEventListener("click", toggle);
    tr.addEventListener("keydown", e => {
      if (e.key === "Enter" || e.key === " ") { e.preventDefault(); toggle(); }
    });
  });
}

async function load(){
  if (EMBEDDED) { DATA = EMBEDDED; render(); return; }
  try {
    const r = await fetch(src + (src.includes("?") ? "&" : "?") + "t=" + Date.now(),
                          {cache:"no-store"});
    if (!r.ok) throw new Error("HTTP " + r.status);
    DATA = await r.json();
    render();
  } catch (err) {
    stamp.textContent = "No data";
    app.innerHTML = `<p class="headline quiet">No results yet.</p>
      <div class="msg">Could not read <code>${esc(src)}</code>: ${esc(err.message)}.<br><br>
      This page reads <code>data.json</code> from the same folder. Run the checker once
      so it publishes that file, then reload.<br><br>
      Opening this file straight off your desktop? Browsers block local file reads.
      Either use the GitHub Pages URL, or append
      <code>?src=</code> and a raw.githubusercontent.com link to data.json.</div>`;
  }
}
load();
</script>
</body>
</html>

name: DOB watch

on:
  schedule:
    - cron: "7 12,16,20 * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "normal = check and alert. seed = record counts, no alert. explain = list the records behind each count."
        type: choice
        required: true
        default: normal
        options: [normal, seed, explain]

permissions:
  contents: write

concurrency:
  group: dob-watch
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt

      - name: Check BIS
        env:
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          ALERT_TO: ${{ secrets.ALERT_TO }}
          ALERT_FROM: ${{ secrets.ALERT_FROM }}
          SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
          SOCRATA_TOKEN: ${{ secrets.SOCRATA_TOKEN }}
          TZ: America/New_York
        run: |
          if [ "${{ inputs.mode }}" = "seed" ]; then
            python monitor.py --seed
          elif [ "${{ inputs.mode }}" = "explain" ]; then
            python monitor.py --explain
          else
            python monitor.py
          fi

      - name: Show what was produced
        if: always()
        run: |
          echo "--- files in docs/ ---"
          ls -la docs/ || echo "NO docs FOLDER"
          echo "--- repo root ---"
          ls -la

      - name: Save state and page data
        run: |
          git config user.name "dob-watch"
          git config user.email "dob-watch@users.noreply.github.com"
          git add -A
          echo "--- staged ---"
          git diff --staged --name-only
          git diff --staged --quiet || git commit -m "check $(date -u +%Y-%m-%dT%H:%MZ)"
          git push
          echo "pushed"

      - name: Confirm data.json is committed
        run: |
          git ls-files docs/data.json | grep . \
            && echo "OK data.json is tracked" \
            || (echo "FAIL data.json is not in the repo" && exit 1)
